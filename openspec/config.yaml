schema: spec-driven

context: |
  Язык артефактов: русский. Ключевые слова SHALL/MUST и WHEN/THEN остаются английскими.
  Приложение: симулятор политик доступа, SPA на React 19 + Mantine + Vite, TypeScript, тесты vitest + Testing Library.
  Данные только в браузере (localStorage), серверной части нет.
  Обязательные ограничения: docs/security-requirements.md (четыре ограничения СБ) и docs/architecture.md
  (единый модуль расчёта src/domain/access.ts, момент передаётся параметром at, компоненты ходят к данным
  только через src/app). Принятые решения лежат в docs/adr/.
  Идентификаторы data-testid из спек являются контрактом с внешними проверками и не переименовываются.

rules:
  specs:
    - Каждое требование содержит SHALL или MUST и хотя бы один сценарий WHEN/THEN с проверяемым примером.
    - У новой возможности раздел ## Purpose пишется сразу, не короче 50 символов.
    - Называть data-testid, которые затрагивает требование.
  design:
    - Пути к файлам писать от корня репозитория (docs/adr/...).
    - Для каждого решения указывать отвергнутую альтернативу и причину.
    - Если изменение добавляет поле или состояние в конфигурацию, раздел «Взаимодействие с импортом, экспортом и сохранённой копией» обязателен (ретроспектива docs/retro/2026-10-27-import-and-new-state.md).
  tasks:
    - Первая задача реализации — красный тест на границе слоя src/app или src/domain.
